# 智美医美顾问 MVP · 独立依赖栈
#
#   docker compose up -d
#   docker compose ps
#   docker compose down          # 停止（保留数据卷）
#   docker compose down -v       # 停止并删除数据（不可逆）
#
# ★★ 为什么这里必须写死项目名 `name: zhimei`（踩过一次，代价很大）★★
#
#   项目名决定了数据卷的最终名字：`<项目名>_zhimei-pg-data`。
#   原来项目名只靠命令行的 `-p zhimei` 提供，一旦忘了这个参数，compose 就按
#   **当前目录名**推导出项目名 `code`，于是——
#     · 它认为这是一套全新的栈，去创建 `code_zhimei-pg-data` 等**一批空卷**；
#     · 应用连上后：29 张表没了、知识库检索为空；
#     · 全程**没有任何警告**，看起来就像"数据被删了"。
#   数据其实一直在 `zhimei_zhimei-pg-data` 里（当时 76 MB），只是挂错了卷。
#   把 `name:` 写进文件后，`docker compose up -d` 无论从哪个目录、加不加 -p，
#   都必定命中正确的项目与数据卷 —— 这种"靠人记得加参数"的设计本身就是缺陷。
#
# 端口刻意与其它项目错开，可与本机已有实例共存：
#   Postgres 55432（本机其它项目占用 5433 / 5434）
#   Milvus   19530（本机其它项目占用 19531 / 19532）
#   MinIO 控制台 9001、Milvus 指标 9091
#
# ★ 镜像 tag 特意选成本机已存在的版本，起栈时无需联网拉取（约省 5GB 下载）：
#     postgres:15-alpine            已存在
#     quay.io/coreos/etcd:v3.5.14   已存在
#     minio/minio:latest            已存在
#     milvusdb/milvus:v2.4.4        已存在（v2.4.x 与 requirements 里的 pymilvus~=2.4.0 匹配）
#   换机器时如果本地没有这些 tag，docker 会自动拉取，不影响使用。
#
# Milvus standalone 由三个容器组成（etcd 元数据 / minio 对象存储 / milvus 本体），
# 这是官方推荐的单机部署形态。

name: zhimei

services:
  postgres:
    image: postgres:15-alpine
    container_name: zhimei-pg
    environment:
      POSTGRES_USER: zhimei
      POSTGRES_PASSWORD: zhimei
      POSTGRES_DB: zhimei          # 库名就是本项目专用，不需要再手工 CREATE DATABASE
      TZ: Asia/Shanghai
    ports:
      - "55432:5432"
    volumes:
      - zhimei-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhimei -d zhimei"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: zhimei-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - zhimei-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: zhimei-minio
    environment:
      # 新旧两套变量名都写上，兼容不同版本的 minio 镜像
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      # ★ 主机侧从 9001 改成 9100 —— 理由见文件末尾「端口为什么这么选」，不是随便挑的。
      #   容器内仍然是 9001（由下面的 --console-address 决定），只动主机这一侧。
      #   控制台地址：http://127.0.0.1:9100
      - "9100:9001"                 # 控制台；9000 只在内部网络暴露，Milvus 走服务名访问
    volumes:
      - zhimei-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: zhimei-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - zhimei-milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"               # gRPC（应用连这个）
      # 指标端口同样避开 9000 号段：9091 离系统保留段上界只差 12 个端口，
      # 系统下次重新划段就可能把它吞掉（症状与 MinIO 那次一模一样）。
      - "19091:9091"                # 健康检查 / 指标
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

volumes:
  zhimei-pg-data:
  zhimei-etcd-data:
  zhimei-minio-data:
  zhimei-milvus-data:

# ══════════════════════════════════════════════════════════════
#  端口为什么这么选（踩过一次，换机器/重启后可能再遇到）
# ══════════════════════════════════════════════════════════════
#
#  报错长这样：
#
#    Error ... exposing port TCP 0.0.0.0:9001 -> 127.0.0.1:0:
#    listen tcp 0.0.0.0:9001: bind: An attempt was made to access
#    a socket in a way forbidden by its access permissions.
#
#  ★ 这**不是**端口被别人占了，也不是权限问题。是端口落在了
#    Windows 的「动态保留段」里 —— Hyper-V / WSL2 / Docker Desktop
#    会动态圈走若干 100 个一组的端口段，被圈走的端口任何程序都 bind 不了
#    （WSAEACCES / 10013）。9001 正好落在 8980-9079 这一段里。
#
#  查当前保留段（不需要管理员）：
#
#    netsh interface ipv4 show excludedportrange protocol=tcp
#
#  实测本机（2026-09）保留段：
#    2106-2205  4857-4956  5042-5141  8380-8479  8680-8779
#    8780-8879  8880-8979  8980-9079  10127-10226  11533-11632  50000-50059
#
#  所以本项目避开 8400-9100 这一段：
#    Postgres 55432 / Milvus 19530 —— 本来就在安全区
#    MinIO 控制台 → 主机 9100（避开 9001）
#    Milvus 指标   → 主机 19091（避开 9091：它离保留段上界只差 12 个端口，
#                   系统下次重新划段就可能把它吞掉，症状一模一样）
#
#  ★ 保留段是**动态**的：重启、开关 Hyper-V、Docker 升级都可能让它整体平移。
#    也就是说"现在能用"不等于"明天还能用"。
#    如果换了机器又撞上，先跑上面那条 netsh 命令看落在哪一段，再挑一个
#    明显在段外的端口（比如 19000 以上）即可 —— 不要试图去"抢回"那个端口，
#    除非用管理员权限做持久化保留，那属于系统级改动，本项目不要求。
#
#  另外：主机侧映射只是**便利**，不是必需。Milvus 是通过内部网络用服务名
#    `minio:9000` 访问 MinIO 的，容器内的 9000/9001 永远不受影响。
#    真不想要控制台，直接删掉 minio 的 ports 那两行也能跑。
