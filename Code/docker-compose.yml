# 智美医美顾问 MVP · 独立依赖栈
#
#   docker compose -p zhimei up -d
#   docker compose -p zhimei ps
#   docker compose -p zhimei down          # 停止（保留数据卷）
#   docker compose -p zhimei down -v       # 停止并删除数据（不可逆）
#
# 端口刻意与其它项目错开，可与本机已有实例共存：
#   Postgres 55432（本机其它项目占用 5433 / 5434）
#   Milvus   19530（本机其它项目占用 19531 / 19532）
#   MinIO 控制台 9001、Milvus 指标 9091
#
# ★ 镜像 tag 特意选成本机已存在的版本，起栈时无需联网拉取（约省 5GB 下载）：
#     postgres:15-alpine            已存在
#     quay.io/coreos/etcd:v3.5.14   已存在
#     minio/minio:latest            已存在
#     milvusdb/milvus:v2.4.4        已存在（v2.4.x 与 requirements 里的 pymilvus~=2.4.0 匹配）
#   换机器时如果本地没有这些 tag，docker 会自动拉取，不影响使用。
#
# Milvus standalone 由三个容器组成（etcd 元数据 / minio 对象存储 / milvus 本体），
# 这是官方推荐的单机部署形态。

services:
  postgres:
    image: postgres:15-alpine
    container_name: zhimei-pg
    environment:
      POSTGRES_USER: zhimei
      POSTGRES_PASSWORD: zhimei
      POSTGRES_DB: zhimei          # 库名就是本项目专用，不需要再手工 CREATE DATABASE
      TZ: Asia/Shanghai
    ports:
      - "55432:5432"
    volumes:
      - zhimei-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zhimei -d zhimei"]
      interval: 5s
      timeout: 3s
      retries: 10

  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: zhimei-etcd
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - zhimei-etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: minio/minio:latest
    container_name: zhimei-minio
    environment:
      # 新旧两套变量名都写上，兼容不同版本的 minio 镜像
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    ports:
      - "9001:9001"                 # 控制台；9000 只在内部网络暴露，Milvus 走服务名访问
    volumes:
      - zhimei-minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: zhimei-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - zhimei-milvus-data:/var/lib/milvus
    ports:
      - "19530:19530"               # gRPC（应用连这个）
      - "9091:9091"                 # 健康检查 / 指标
    depends_on:
      - etcd
      - minio
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3

volumes:
  zhimei-pg-data:
  zhimei-etcd-data:
  zhimei-minio-data:
  zhimei-milvus-data:
