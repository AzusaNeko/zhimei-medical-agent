<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>智美医美顾问 · 坐席工作台</title>
<style>
/* ══════════════════════════════════════════════════════════════
   智美医美顾问 · 坐席工作台
   视觉方向：临床白 · Clinical Precision（与 /chat 共用同一套令牌）
   ──────────────────────────────────────────────────────────────
   只换皮，不改功能。规则集与原文件逐一对应，选择器一个不删，
   因此 body 标记与页面脚本的全部 DOM 钩子都不需要改。

   ⚠ 注意：本文件是 CSS，注释里绝不能出现带尖括号的 script/style
     字样 —— 静态检查脚本用正则从整份 HTML 里截取脚本块，会从第一
     个匹配处开始，注释里的假标签会把后面半句当成 JS 解析。

   ★ 顺带修掉一个真实 bug：
     原文件 .auth-msg 写了 color:var(--bad)，但 :root 里从未声明 --bad，
     声明在计算值阶段无效 → 登录错误提示一直用继承色（不是红色）。
     这里显式声明 --bad，登录失败才真的显示为错误色。

   ★ 测试工单不再用紫色（紫色不在本方向令牌内）：
     改用中性底 + 虚线描边 + 降饱和整行来区分。语义上更准确 ——
     "这不是一张真实工单"，而不是"这是另一类工单"。
   ══════════════════════════════════════════════════════════════ */
:root{
  /* 文字与线条 */
  --ink:#0F1D2B; --ink-2:#33475A; --muted:#67788A;
  --line:#E4EAF0; --line-strong:#CBD6E0;
  /* 表面 */
  --bg:#FAFBFC; --surface:#FFFFFF; --surface-2:#F4F7FA;
  /* 布局：栏间距 —— 它同时就是分隔条的宽度（两者是同一个东西） */
  --gut:18px;
  /* 主色（只用于主操作与选中态） */
  --primary:#0B6E6E; --primary-hover:#095858; --primary-soft:#E6F2F1;
  /* 语义色（只表语义，不作装饰） */
  --ok:#16794F; --ok-soft:#E6F2EC;
  --warn:#9A6B12; --warn-soft:#FBF3E2; --warn-line:#EAD9B0;
  --bad:#B3261E; --bad-hover:#8F1D17; --bad-soft:#FBEAE8; --bad-line:#EFCFC9;
  --info-soft:#EAF0F7; --info-ink:#1E4E7A;
  /* 优先级令牌：沿用原有语义映射（P0 最急 → bad，P1 → warn，P2 → 中性） */
  --p0:var(--bad); --p1:var(--warn); --p2:var(--muted);
  /* 兼容旧变量名 */
  --accent:var(--primary); --card:var(--surface);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
     font:14px/1.65 "PingFang SC","Microsoft YaHei",-apple-system,"Segoe UI",sans-serif}
a,button{cursor:pointer;font:inherit}
.topbar{position:sticky;top:0;z-index:10;display:flex;flex-wrap:wrap;gap:12px 20px;
        align-items:center;justify-content:space-between;padding:12px 24px;
        background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.3}
.brand .eyebrow{font:11px "JetBrains Mono","SF Mono",Consolas,monospace;color:var(--primary);
                letter-spacing:1.5px}
.brand b{font-size:15px;font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,input,textarea{font:inherit;padding:7px 10px;border:1px solid var(--line);
                      border-radius:6px;background:var(--surface);color:var(--ink)}
textarea{width:100%;min-height:84px;resize:vertical;line-height:1.6}
button{border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:7px 13px;
       color:var(--ink);transition:background-color .12s ease-out,border-color .12s ease-out}
button:hover{background:var(--surface-2);border-color:var(--line-strong)}
button.primary{background:var(--primary);border-color:var(--primary);color:#fff}
button.primary:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
button.danger{border-color:var(--bad-line);color:var(--bad)}
button.danger:hover{background:var(--bad-soft);border-color:var(--bad)}
button:disabled{opacity:.45;cursor:not-allowed}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line-strong)}
.dot.on{background:var(--ok)}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;
         max-width:1560px;margin:16px auto 0;padding:0 24px}
.metric{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 14px}
.metric b{display:block;font-size:20px;font-weight:600;letter-spacing:-.5px;
          font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
.metric span{color:var(--muted);font-size:12px}
/* 两栏：待处理队列 | 工单详情。宽度走 CSS 变量，拖动分隔条时只改变量 ——
   不内联 grid-template-columns，否则会压过下面的窄屏媒体查询。 */
.layout{display:grid;
        grid-template-columns:minmax(300px, var(--col-1, 1fr)) var(--gut)
                              minmax(380px, var(--col-2, 1.35fr));
        gap:0;max-width:1560px;margin:18px auto;padding:0 24px 48px}

/* ── 可拖拽分隔条 ──
   占的就是原来的栏间距：鼠标落在空隙上就能拖，不必再画一条竖线。
   平时透明，悬停/聚焦/拖动时才显出一条 2px 提示线。 */
.splitter{position:relative;align-self:stretch;cursor:col-resize;background:transparent;
          touch-action:none}
.splitter::after{content:"";position:absolute;top:0;bottom:0;left:50%;width:2px;
                 transform:translateX(-50%);border-radius:1px;background:transparent;
                 transition:background-color .12s ease-out}
.splitter:hover::after{background:var(--line-strong)}
.splitter:focus-visible{outline:none}
.splitter:focus-visible::after,.splitter.dragging::after{background:var(--primary)}
.pane{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden;
      display:flex;flex-direction:column;min-height:520px}
.pane>h2{margin:0;padding:12px 18px;font-size:14px;font-weight:600;border-bottom:1px solid var(--line);
         background:var(--surface-2);display:flex;justify-content:space-between;align-items:center;
         gap:10px}
.pane-body{overflow:auto;flex:1}
.row{padding:12px 18px;border-bottom:1px solid var(--line);display:grid;gap:4px;
     border-left:3px solid transparent;cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.active{background:var(--primary-soft);border-left-color:var(--primary)}
.row .line1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{font:11px/1.4 "JetBrains Mono","SF Mono",Consolas,monospace;padding:2px 7px;border-radius:4px;
       white-space:nowrap}
.badge.p0{background:var(--bad-soft);color:var(--bad)}
.badge.p1{background:var(--warn-soft);color:var(--warn)}
.badge.p2{background:var(--surface-2);color:var(--ink-2)}
.badge.st{background:var(--info-soft);color:var(--info-ink)}

/* ── 风险等级徽章（队列的**展示口径**，取代原来的 P0/P1）──
   三档：高/中/低。等级由 ops.service.risk_of 从多个来源推导，
   并带一句理由（急诊信号 / 审查裁决交由人工 / 优先级 P1 …）——
   红标必须能解释，否则只是情绪压力。 */
.badge.rk{font-weight:600}
.badge.rk.high{background:var(--bad-soft);color:var(--bad)}
.badge.rk.medium{background:var(--warn-soft);color:var(--warn)}
.badge.rk.low{background:var(--ok-soft,#e6f4ee);color:var(--ok,#1a5044)}
.row .risk-why{color:var(--muted);font-size:11.5px}

/* 风险分窗口：每个等级一个独立分区，各自滚动、各自计数 */
.risksec{border-bottom:1px solid var(--line)}
.risksec:last-child{border-bottom:0}
.risksec-head{display:flex;align-items:center;gap:8px;padding:8px 18px;
              background:var(--surface-2);position:sticky;top:0;z-index:1;
              font-size:12.5px;font-weight:600;color:var(--ink-2)}
.risksec-head .n{font:11px/1.4 "JetBrains Mono","SF Mono",Consolas,monospace;
                 padding:1px 7px;border-radius:9px;background:var(--surface-1);
                 border:1px solid var(--line);color:var(--muted)}
.risksec-head .hint{font-weight:400;color:var(--muted);font-size:11.5px}
.risksec.high .risksec-head{background:var(--bad-soft);color:var(--bad)}
.risksec.medium .risksec-head{background:var(--warn-soft);color:var(--warn)}
.risksec.low .risksec-head{background:var(--ok-soft,#e6f4ee);color:var(--ok,#1a5044)}
.risksec .none{padding:10px 18px;color:var(--muted);font-size:12px}
/* 已结束的工单：详情里明确标出来，避免"看起来还在处理中" */
.ended{margin:0 0 10px;padding:9px 12px;border-radius:7px;background:var(--surface-2);
       border:1px solid var(--line);color:var(--ink-2);font-size:12.5px;line-height:1.6}
.badge.warn{background:var(--bad-soft);color:var(--bad)}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.row .sub{color:var(--muted);font-size:12.5px}
/* 队列行里的发起人与等待时长：这是坐席扫队列时最先看的两件事 */
.row .who{color:var(--ink);font-weight:600}
.row .sub b{color:var(--ink);font-weight:600}
.row .sub b.over{color:var(--bad)}
.row .sub .muted{color:var(--muted)}
/* 「对话原文已被顾客删除」的提示：必须显眼，否则坐席会以为系统坏了 */
.tdel{margin:0 0 10px;padding:9px 12px;border-radius:6px;background:var(--warn-soft);
      border:1px solid var(--warn-line);color:var(--warn);font-size:12.5px;line-height:1.6}
.section{padding:14px 18px;border-bottom:1px solid var(--line)}
.section h3{margin:0 0 8px;font-size:13px;color:var(--muted);letter-spacing:.5px}
.kv{display:grid;grid-template-columns:88px 1fr;gap:4px 10px;font-size:13px}
.kv dt{color:var(--muted)}
.kv dd{margin:0;word-break:break-word}
.msg{padding:8px 10px;border-radius:8px;margin:6px 0;font-size:13px;white-space:pre-wrap}
.msg.user{background:var(--surface-2)}
.msg.assistant{background:var(--ok-soft)}
.msg.agent{background:var(--info-soft)}
.msg.system{background:var(--warn-soft)}
.hit{font:12px/1.6 "JetBrains Mono","SF Mono",Consolas,monospace;background:var(--bad-soft);
     color:var(--bad);padding:2px 6px;border-radius:4px;margin-right:6px;display:inline-block}
.empty{color:var(--muted);padding:24px 18px;font-size:13px}
.toast{position:fixed;right:20px;bottom:20px;max-width:380px;background:var(--ink);color:#fff;
       padding:12px 16px;border-radius:8px;font-size:13px;z-index:20}

/* ── 登录浮层 ── */
.auth{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
      background:rgba(15,29,43,.5);backdrop-filter:blur(3px)}
.auth[hidden]{display:none}
.auth-card{width:min(430px,92vw);background:var(--surface);border-radius:8px;padding:26px 28px 20px;
           box-shadow:0 16px 48px rgba(15,29,43,.18)}
.auth-card h1{margin:0 0 6px;font-size:19px;font-weight:600}
.auth-card .sub{margin:0 0 18px;font-size:12.5px;color:var(--muted);line-height:1.7}
.auth-card .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.auth-card .field label{font-size:12.5px;color:var(--muted)}
.auth-card .field input{padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit;
                        background:var(--surface);color:var(--ink)}
.auth-card .field input:focus{outline:none;border-color:var(--primary);
                              box-shadow:0 0 0 3px var(--primary-soft)}
.auth-card button{width:100%;padding:11px;font-size:14.5px;margin-top:4px}
.auth-msg{min-height:20px;font-size:12.5px;margin-top:10px;line-height:1.6;color:var(--bad)}
.auth-tip{margin-top:14px;padding:9px 11px;background:var(--surface-2);border:1px solid var(--line);
          border-radius:6px;font-size:11.5px;color:var(--muted);line-height:1.8}
.auth-tip code{color:var(--primary);font-family:"JetBrains Mono","SF Mono",Consolas,monospace}
/* 顶栏身份显示 */
.whoami{display:flex;align-items:center;gap:7px;font-size:12.5px}
.role-badge{font:11px "JetBrains Mono","SF Mono",Consolas,monospace;padding:2px 8px;border-radius:4px;
            background:var(--primary-soft);color:var(--primary);border:1px solid var(--line-strong)}
.raw-flag{font:11px "JetBrains Mono","SF Mono",Consolas,monospace;padding:2px 8px;border-radius:4px;
          background:var(--bad-soft);color:var(--bad);border:1px solid var(--bad-line)}
.testtoggle{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--muted)}
/* 测试工单行：中性底 + 虚线徽章 + 整行降饱和，一眼能和真实工单区分开 */
.badge.test{background:var(--surface-2);color:var(--ink-2);border:1px dashed var(--line-strong)}
.row.is-test{background:var(--surface-2);opacity:.82}
.row.is-test .line1 strong{color:var(--ink-2)}
.toast.alert{background:var(--bad)}
.toast:empty{display:none}
@media(max-width:1000px){.layout{grid-template-columns:1fr} .splitter{display:none}}

/* ── 自建弹窗（替换原生 alert / confirm / prompt）──
   ★ 为什么不用原生：样式无法定制、与页面脱节，confirm 是**同步阻塞**的，
     prompt 只有单行输入且做不了必填校验。坐席端的"关闭原因"是**必填**的，
     原生 prompt 点确定给空串也能过去，这里改成就地标红不让提交。
   ★ DOM 由脚本按需创建，正文一律走 textContent（不解析 HTML）。 */
.dlg-scrim{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;
           background:rgba(15,29,43,.5);backdrop-filter:blur(3px);padding:24px}
.dlg-card{width:min(460px,92vw);max-height:86vh;overflow:auto;background:var(--surface);
          border-radius:8px;padding:22px 24px 18px;box-shadow:0 16px 48px rgba(15,29,43,.18);
          display:flex;flex-direction:column;gap:12px}
.dlg-title{margin:0;font-size:16px;font-weight:600;color:var(--ink)}
.dlg-body{margin:0;font-size:13px;line-height:1.75;color:var(--ink-2);white-space:pre-wrap;
          word-break:break-word}
.dlg-field{display:flex;flex-direction:column;gap:5px}
.dlg-field span{font-size:12.5px;color:var(--muted)}
.dlg-field input{padding:9px 11px;border:1px solid var(--line);border-radius:6px;font:inherit;
                 background:var(--surface);color:var(--ink)}
.dlg-field input:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.dlg-field input.bad{border-color:var(--bad);box-shadow:0 0 0 3px var(--bad-soft)}
.dlg-foot{display:flex;justify-content:flex-end;gap:9px}
.dlg-foot button{font-size:13px;padding:8px 16px}
.dlg-foot button.danger-solid{background:var(--bad);border-color:var(--bad);color:#fff}
.dlg-foot button.danger-solid:hover:not(:disabled){background:var(--bad-hover);
                                                    border-color:var(--bad-hover)}

/* 减少动效 */
@media (prefers-reduced-motion: reduce){
  *,::before,::after{animation-duration:.01ms!important;animation-iteration-count:1!important;
                      transition-duration:.01ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <span class="eyebrow">ZHIMEI / OPS CONSOLE</span>
    <b>坐席工作台 · 高风险回复处理</b>
  </div>
  <div class="tools">
    <!-- ★ 这里原来是一个「角色」下拉框（service / doctor / compliance）。
         那是一个真实的安全洞：角色由**客户端自己声明**，改个下拉框就能拿到
         未脱敏的手机号。现在角色来自登录令牌 + 数据库，下面只做**显示**。 -->
    <span class="whoami" id="whoami" hidden>
      <b id="agentName">—</b>
      <span class="role-badge" id="agentRole">—</span>
      <span class="raw-flag" id="rawFlag" hidden>可见明文 PII</span>
    </span>
    <span><i class="dot" id="connDot"></i> <span id="connText">未连接</span></span>
    <!-- 测试工单（channel=test）默认不进队列；要看时勾这里，行上带"测试"徽章 -->
    <label class="testtoggle" title="测试工单默认不进队列。勾上才会显示，行上会标「测试」">
      <input type="checkbox" id="showTest"> 显示测试工单
    </label>
    <button id="purgeTest" hidden
            title="只清理带 is_test 标记的工单，真实工单不受影响">清理测试工单</button>
    <button id="refresh">刷新</button>
    <button id="logout" hidden>退出</button>
  </div>
</header>

<!-- ══════ 坐席登录 ══════ -->
<div class="auth" id="authLayer" hidden>
  <form class="auth-card" id="loginForm">
    <h1>坐席登录</h1>
    <p class="sub">角色由后台账号决定，登录后自动生效。<br>
      演示账号见 <code>README</code>；四个角色各一个，口令相同。</p>
    <div class="field"><label>邮箱</label>
      <input id="loginEmail" type="email" autocomplete="username" required></div>
    <div class="field"><label>密码</label>
      <input id="loginPwd" type="password" autocomplete="current-password" required></div>
    <button class="primary" type="submit" id="loginBtn">登录</button>
    <div class="auth-msg" id="authMsg"></div>
    <div class="auth-tip">
      客服 <code>service@zhimei.test</code> · 医师 <code>doctor@zhimei.test</code><br>
      合规 <code>compliance@zhimei.test</code> · 管理员 <code>admin@zhimei.test</code><br>
      口令均为 <code>zhimei-demo-2026</code>
    </div>
  </form>
</div>

<div class="metrics" id="metrics"></div>

<div class="layout">
  <section class="pane" id="paneQueue">
    <h2>待处理队列 <span class="sub" id="queueCount"></span></h2>
    <div class="pane-body" id="queue"><div class="empty">加载中…</div></div>
  </section>

  <!-- 拖动这条空隙即可改两栏比例（双击恢复默认） -->
  <div class="splitter" data-split="1" role="separator" aria-orientation="vertical"
       tabindex="0" aria-label="拖动调整队列与详情的宽度（双击恢复默认）"></div>

  <section class="pane" id="paneDetail">
    <h2>工单详情 <span class="sub" id="detailTitle"></span></h2>
    <div class="pane-body" id="detail"><div class="empty">从左侧选择一个工单</div></div>
  </section>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
const state = { tickets: [], current: null, detail: null };
const $ = (id) => document.getElementById(id);

/* ══════════════════════════════════════════════════════════════
   自建弹窗 —— 替代原生 alert / confirm / prompt
   ──────────────────────────────────────────────────────────────
   ★ 为什么不用原生：样式由浏览器决定、与整页视觉脱节且无法定制，
     confirm / alert 是**同步阻塞**的，prompt 只有单行输入。
   ★ 这里做成 Promise 版，调用处写法与原生几乎一致：
       const ok  = await dialogs.confirm({ title, body, okText, danger });
       const txt = await dialogs.prompt({ title, body, input: { label, required } });
   ★ 坐席端有两处特别适合自建弹窗：
     · "关闭原因"是**必填**的 —— 原生 prompt 点确定给空串也能过，这里就地标红拦住；
     · "命中提示类规则仍要发送"是危险动作 —— 用 danger 态按钮，
       取消按钮改成"返回修改"，比原生"确定/取消"更能说明后果。
   ★ DOM 按需创建，正文一律走 textContent（不解析 HTML）。
   ★ `window.dialogs` 单独留一层可替换入口，方便静态检查脚本驱动。
   ══════════════════════════════════════════════════════════════ */
function buildDialog(o) {
  return new Promise((resolve) => {
    const scrim = document.createElement("div");
    scrim.className = "dlg-scrim";

    const card = document.createElement("div");
    card.className = "dlg-card";
    card.setAttribute("role", "dialog");
    card.setAttribute("aria-modal", "true");
    card.setAttribute("aria-label", String(o.title || "提示"));

    const h = document.createElement("h3");
    h.className = "dlg-title";
    h.textContent = o.title || "提示";
    card.appendChild(h);

    if (o.body) {
      const b = document.createElement("div");
      b.className = "dlg-body";
      b.textContent = o.body;
      card.appendChild(b);
    }

    let input = null;
    if (o.input) {
      const field = document.createElement("label");
      field.className = "dlg-field";
      const lab = document.createElement("span");
      lab.textContent = o.input.label || "";
      input = document.createElement("input");
      input.type = "text";
      input.value = o.input.value || "";
      input.placeholder = o.input.placeholder || "";
      field.appendChild(lab);
      field.appendChild(input);
      card.appendChild(field);
    }

    const foot = document.createElement("div");
    foot.className = "dlg-foot";
    const cancel = document.createElement("button");
    cancel.type = "button";
    cancel.textContent = o.cancelText || "取消";
    const ok = document.createElement("button");
    ok.type = "button";
    ok.className = "primary" + (o.danger ? " danger-solid" : "");
    ok.textContent = o.okText || "确定";
    if (o.cancelText !== null) foot.appendChild(cancel);
    foot.appendChild(ok);
    card.appendChild(foot);

    scrim.appendChild(card);
    document.body.appendChild(scrim);

    const back = document.activeElement;
    const finish = (v) => {
      if (scrim.parentNode) scrim.parentNode.removeChild(scrim);
      else scrim.remove();
      try { if (back && back.focus) back.focus(); } catch (e) { /* 焦点回不去不影响结果 */ }
      resolve(v);
    };
    const abort = () => finish(input ? null : false);

    ok.onclick = () => {
      if (input && o.input.required && !input.value.trim()) {
        input.classList.add("bad");       // 必填未填：就地标红，不关窗
        try { input.focus(); } catch (e) {}
        return;
      }
      finish(input ? input.value.trim() : true);
    };
    cancel.onclick = abort;
    scrim.onclick = (e) => { if (e.target === scrim) abort(); };
    scrim.onkeydown = (e) => {
      if (e.key === "Escape") abort();
      else if (e.key === "Enter" && input) ok.onclick();
    };
    // 打开即聚焦：有输入框就聚焦输入框，否则聚焦主按钮（回车即可确认）
    try { (input || ok).focus(); } catch (e) {}
  });
}

window.dialogs = {
  confirm: (o) => buildDialog(Object.assign({ okText: "确定", cancelText: "取消" }, o)),
  prompt: (o) => buildDialog(Object.assign({ okText: "确定", cancelText: "取消", input: {} }, o)),
  alert: (o) => buildDialog(Object.assign({ okText: "知道了", cancelText: null }, o)),
};

/* ══════════════════════════════════════════════════════════════
   卡片拉伸 —— 拖动栏间分隔条改宽度（队列 | 详情）
   ──────────────────────────────────────────────────────────────
   ★ 拿"栏间空隙"当把手，不另画竖线：空隙本来就在那儿，
     鼠标落上去就能拖，也不额外占视觉空间。
   ★ 宽度写进 CSS 变量而**不**内联 grid-template-columns：
     内联样式优先级高于媒体查询，会把 ≤1000px 的单栏布局钉死。
   ★ 拖动只调整相邻两栏、两者总宽不变；下限按最小可读宽度夹住
     （详情栏里是风险报告与对话原文，太窄就没法看了）。
   ★ 双击恢复默认；聚焦后 ← / → 也能调（Shift 加速）。
   ★ 桩环境 / 老浏览器拿不到 style.setProperty 就直接不启用，绝不抛错。
   ★ 与 /chat 用不同的存储键：两个页面的栏数与语义都不同，宽度不能串。
   ══════════════════════════════════════════════════════════════ */
var SPLIT_STORE = "zhimei.opscolwidths";
var SPLIT_COLS = ["#paneQueue", "#paneDetail"];
var SPLIT_MIN = [300, 380];               // 每栏的最小可读宽度(px)

(function initSplitters() {
  var host = document.querySelector(".layout");
  if (!host || !host.style || typeof host.style.setProperty !== "function") return;
  var handles = Array.prototype.slice.call(document.querySelectorAll(".splitter"));
  if (!handles.length) return;

  var n = SPLIT_COLS.length;

  function colEls() {
    return SPLIT_COLS.map(function (sel) { return host.querySelector(sel); });
  }
  // 读**真实渲染宽度**：拖动要以当前实际宽度为基准，不能凭记忆里的上次值
  function widths() {
    return colEls().map(function (el) {
      return (el && el.getBoundingClientRect) ? el.getBoundingClientRect().width : 0;
    });
  }
  // ★ 写 fr 而**不是** px：fr 按比例分配"扣掉栏间距之后剩下的空间"，于是
  //   ① 栅格永远填满容器；② 改窗口大小时自动等比缩放 —— 连 resize 监听都不用写。
  //   写成 px 的话，拖过一次布局就变刚性了：窗口变宽只会在右侧留一片空白。
  function apply(w) {
    for (var i = 0; i < n; i++) {
      host.style.setProperty("--col-" + (i + 1), w[i].toFixed(3) + "fr");
    }
  }
  function reset() {
    for (var i = 1; i <= n; i++) host.style.removeProperty("--col-" + i);
    try { localStorage.removeItem(SPLIT_STORE); } catch (e) { /* 隐私模式下写不了，忽略 */ }
  }
  function save(w) {
    try { localStorage.setItem(SPLIT_STORE, JSON.stringify(w)); } catch (e) { /* 同上 */ }
  }
  function restore() {
    try {
      var w = JSON.parse(localStorage.getItem(SPLIT_STORE) || "null");
      if (!w || w.length !== n) return;
      for (var i = 0; i < n; i++) {
        if (typeof w[i] !== "number" || !isFinite(w[i]) || w[i] < SPLIT_MIN[i]) return;
      }
      apply(w);
    } catch (e) { /* 存坏了就当没存过，用默认布局 */ }
  }
  /** 按位移重新分配相邻两栏，两者总宽保持不变。 */
  function move(left, right, base, delta) {
    var pair = base[left] + base[right];
    var a = Math.max(SPLIT_MIN[left], Math.min(pair - SPLIT_MIN[right], base[left] + delta));
    var w = base.slice();
    w[left] = Math.round(a);
    w[right] = Math.round(pair - a);
    apply(w);
    return w;
  }

  handles.forEach(function (h, idx) {
    var left = idx, right = idx + 1;
    h.title = "拖动调整宽度（双击恢复默认）";

    h.addEventListener("pointerdown", function (ev) {
      if (ev.button) return;                       // 只响应左键
      var base = widths();
      if (!base[left] || !base[right]) return;
      ev.preventDefault();
      var startX = ev.clientX;
      h.classList.add("dragging");
      try { if (h.setPointerCapture) h.setPointerCapture(ev.pointerId); } catch (e) {}

      function onMove(e) { move(left, right, base, e.clientX - startX); }
      function onUp() {
        document.removeEventListener("pointermove", onMove);
        document.removeEventListener("pointerup", onUp);
        document.removeEventListener("pointercancel", onUp);
        h.classList.remove("dragging");
        save(widths());                            // 存真实宽度，而不是算出来的中间值
      }
      document.addEventListener("pointermove", onMove);
      document.addEventListener("pointerup", onUp);
      document.addEventListener("pointercancel", onUp);
    });

    h.addEventListener("dblclick", reset);

    h.addEventListener("keydown", function (e) {
      var step = e.shiftKey ? 48 : 16;
      var d = e.key === "ArrowLeft" ? -step : (e.key === "ArrowRight" ? step : 0);
      if (!d) return;
      var base = widths();
      if (!base[left] || !base[right]) return;
      e.preventDefault();
      save(move(left, right, base, d));
    });
  });

  restore();
})();

function headers() {
  // ★ 角色**不再由这里声明**。这里只带令牌，角色由服务端从数据库读。
  //   原来的写法是 X-Agent-Role: $("role").value —— 改个下拉框就能拿到
  //   未脱敏的手机号，那是本项目最严重的一个洞。
  const h = {"Content-Type": "application/json"};
  const t = localStorage.getItem("zhimei.agentToken");
  if (t) h["Authorization"] = "Bearer " + t;
  return h;
}

let me = null;   // 当前坐席（登录后由服务端返回）
let myPerms = [];  // 当前坐席的权限清单（前端据此显示/隐藏按钮；服务端仍会再判一次）
let detailMsgCount = null;  // 详情里那台会话的消息条数（发现"顾客又说话了"）

//: **待处理**状态。与服务端 `ops.service.ACTIVE_STATUSES` 是同一份约定。
//: ★ 前端也要有一份，是因为"要不要继续跟踪这个工单的新消息"这个判断在客户端 ——
//:   而边界很清楚：工单结束 = 人工退场 = 顾客再说话是找 AI 的，
//:   不该再推到坐席面前。两侧不一致的话，就会出现"关单后还在收顾客请求"。
const ACTIVE_STATUSES = ["open", "accepted", "in_progress", "escalated"];

async function api(url, opts = {}) {
  const r = await fetch(url, opts);
  if (r.status === 401) {
    localStorage.removeItem("zhimei.agentToken");
    showAuth("登录已过期，请重新登录");
    throw new Error("unauthorized");
  }
  return r;
}

function showAuth(msg) {
  document.getElementById("authLayer").hidden = false;
  document.getElementById("logout").hidden = true;
  const el = document.getElementById("authMsg");
  el.textContent = msg || "";
}

function hideAuth() {
  document.getElementById("authLayer").hidden = true;
  document.getElementById("logout").hidden = false;
  document.getElementById("whoami").hidden = false;
}

async function doLogin(ev) {
  ev.preventDefault();
  const msg = document.getElementById("authMsg");
  msg.textContent = "登录中…";
  try {
    const r = await fetch("/ops/auth/login", {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        email: document.getElementById("loginEmail").value.trim(),
        password: document.getElementById("loginPwd").value,
      })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { msg.textContent = d.message || "登录失败"; return; }
    localStorage.setItem("zhimei.agentToken", d.access_token);
    me = d.agent;
    myPerms = d.permissions || [];
    msg.textContent = "";
    applyIdentity();
    hideAuth();
    await bootData();
  } catch (e) {
    msg.textContent = "网络错误：" + e.message;
  }
}

function applyIdentity() {
  const role = (me && me.role) || "?";
  document.getElementById("agentName").textContent =
    (me && me.name) || (me && me.agent_id) || "—";
  document.getElementById("agentRole").textContent = role;
  // 一眼看出当前身份能不能看到明文 PII —— 这是坐席最需要心里有数的一件事
  document.getElementById("rawFlag").hidden = !["doctor", "compliance", "admin"].includes(role);
  // 清理测试工单是不可逆操作，只给有权限的角色（服务端也会再判一次）
  document.getElementById("purgeTest").hidden = !myPerms.includes("admin:purge");
  document.title = `坐席工作台 · ${role}`;
}

function logout() {
  localStorage.removeItem("zhimei.agentToken");
  me = null;
  showAuth("已退出登录");
  document.getElementById("queue").innerHTML = '<div class="empty">请先登录</div>';
  document.getElementById("detail").innerHTML = '<div class="empty">请先登录</div>';
}

async function bootData() {
  // ★ 每一步各**自**兜住异常。原来这里是 `connectStream()` —— 一个拼错的
  //   函数名（真名是 `connect`），抛出的 ReferenceError 一路冒到 start()
  //   的 catch，被当成"无法连接服务"，于是**每次刷新都弹回登录页**，
  //   而队列和指标其实都加载好了。
  //   一个拼写错误之所以能伪装成"登录失效"，就是因为这几步没有隔离：
  //   任何一步抛错，后面每一步都不会执行，最后的错误还归错到了认证上。
  try { await loadQueue(); } catch (e) { console.error("[坐席台] 队列加载失败", e); }
  try { await loadMetrics(); } catch (e) { console.error("[坐席台] 指标加载失败", e); }
  try { connect(); } catch (e) { console.error("[坐席台] 实时流启动失败", e); }
}

/** 令牌校验这一步没通过，但**不能**据此断定用户没登录。
 *
 *  ★ 只有 401 / 403 才等于"令牌不可用"。网络抖动、后端 500、以及前端
 *    自己的一个 bug，都会走到这里 —— 那些情况下把令牌删掉、弹登录页，
 *    等于替用户做了"重新登录"的决定，而且**真正的原因永远看不到**。
 *    所以这里保留令牌、如实报错，用户点【刷新】就能重试。
 */
function keepTokenBoot(msg) {
  hideAuth();                       // 令牌还在，不弹登录页（否则误导用户去重新登录）
  console.error("[坐席台] 启动校验未通过：" + msg);
  toast(msg + " —— 令牌已保留，点【刷新】可重试", true);
  $("agentName").textContent = "（未校验）";
  $("agentRole").textContent = "?";
}

document.getElementById("loginForm").addEventListener("submit", doLogin);
document.getElementById("logout").onclick = logout;
document.getElementById("purgeTest").onclick = purgeTest;
// 切换"显示测试工单"时重新拉队列；不动当前详情（用户可能正在看某张工单）。
// 实时流也要跟着重连：它自带 include_test 查询串，不重连就还是旧的口径。
document.getElementById("showTest").onchange = () => { loadQueue(); connect(); };
let toastTimer;
function toast(text, isAlert) {
  const el = $("toast");
  el.textContent = text;
  el.className = "toast" + (isAlert ? " alert" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.textContent = ""; }, 5000);
}
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtWait = (s) => s < 60 ? s + "s" : (s < 3600 ? Math.floor(s / 60) + "m" : Math.floor(s / 3600) + "h");

// ── 队列 ──────────────────────────────────────────────
async function loadQueue() {
  try {
    const showTest = $("showTest").checked;
    const r = await fetch(`/ops/tickets?include_test=${showTest}`, { headers: headers() });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    const data = await r.json();
    state.tickets = data.tickets || [];
    renderQueue();
  } catch (e) {
    $("queue").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

/** 清理测试工单。只删带 is_test 标记的 —— 真实工单不受影响。 */
async function purgeTest() {
  const n = state.tickets.filter((t) => t.is_test).length;
  if (!n) { toast("当前列表里没有测试工单", false); return; }
  const go = await dialogs.confirm({
    title: "清理测试工单",
    body: `将删除 ${n} 张测试工单（is_test=true）。\n`
        + "真实工单不会被删除 —— 清理条件写死在代码里，这条路径不可能删到真实工单。\n\n"
        + "确定继续？",
    okText: "清理",
    cancelText: "取消",
    danger: true,
  });
  if (!go) return;
  try {
    const r = await api("/ops/tickets/test", {method: "DELETE", headers: headers()});
    const d = await r.json();
    if (!r.ok) { toast(d.message || "清理失败", true); return; }
    state.current = null;
    state.detail = null;
    $("detail").innerHTML = '<div class="empty">从左侧选择一个工单</div>';
    toast(d.message, false);
    await loadQueue();
    await loadMetrics();
  } catch (e) {
    toast("清理失败：" + e.message, true);
  }
}

//: 风险等级的顺序、标题与说明。**与服务端 `ops.service.RISK_ORDER/RISK_LABEL` 一致。**
//:
//: ★ 展示口径是**风险等级**，不是 P0/P1：
//:   P0/P1 是**调度优先级**（决定 SLA 阈值、排序），它回答"先做哪个"；
//:   而坐下来处理一张单子的人，第一个要知道的是"这件事有多危险"。
//:   两者经常一致、但并不总是一致 —— 比如优先级 P2 但审查裁决交给了人工，
//:   那是**高风险**；而 P0 的急诊，风险当然也高。
//:   所以队列按风险分三个窗口，而不是按优先级排一列。
const RISK_ORDER = ["high", "medium", "low"];
const RISK_LABEL = {high: "高风险", medium: "中风险", low: "低风险"};
const RISK_HINT = {
  high: "可能涉及安全或合规问题，请优先接单",
  medium: "需要人工判断，按等待时长顺序处理",
  low: "常规咨询转来的，可稍后处理",
};

function renderQueue() {
  const all = state.tickets || [];
  $("queueCount").textContent = all.length ? `共 ${all.length} 条待处理` : "";

  if (!all.length) {
    $("queue").innerHTML = '<div class="empty">当前没有待处理工单<br>'
      + '<span style="font-size:11.5px">（已结束的工单会立刻离开队列）</span></div>';
    return;
  }

  // ★ 三个窗口**分开渲染**（而不是一个列表按风险排序）：
  //   分窗口之后，"高风险里有没有人等着"这件事是**一眼可见**的 ——
  //   排序还得自己找分界线，而分界线恰恰是最容易看漏的东西。
  const byRisk = {high: [], medium: [], low: []};
  for (const t of all) (byRisk[t.risk_level] || byRisk.low).push(t);

  $("queue").innerHTML = RISK_ORDER.map((lvl) => {
    const rows = byRisk[lvl];
    const head = `<div class="risksec-head">
        <span class="badge rk ${lvl}">${RISK_LABEL[lvl]}</span>
        <span class="n">${rows.length}</span>
        <span class="hint">${RISK_HINT[lvl]}</span>
      </div>`;
    const body = rows.length ? rows.map((t) => queueRow(t)).join("")
      : `<div class="none">（没有${RISK_LABEL[lvl]}的工单）</div>`;
    return `<div class="risksec ${lvl}">${head}${body}</div>`;
  }).join("");

  $("queue").querySelectorAll(".row").forEach((el) =>
    el.addEventListener("click", () => openTicket(el.dataset.id)));
}

function queueRow(t) {
  const lvl = t.risk_level || "low";
  return `
    <div class="row ${state.current === t.ticket_id ? "active" : ""} ${t.is_test ? "is-test" : ""}"
         data-id="${t.ticket_id}">
      <div class="line1">
        <span class="badge rk ${lvl}">${esc(t.risk_label || RISK_LABEL[lvl])}</span>
        <b>${esc(t.reason)}</b>
        <span class="badge st">${esc(t.status)}</span>
        ${t.is_test ? '<span class="badge test">测试</span>' : ""}
        ${t.sla_breached ? '<span class="badge warn">已超时</span>' : ""}
      </div>
      <div class="sub">
        <span class="who" title="发起人（队列里只显示首字，看全名请点开详情）">${esc(t.user_name || "（未登记）")}</span>
        · 已等待 <b class="${t.sla_breached ? "over" : ""}">${fmtWait(t.wait_seconds)}</b>
        <span class="muted">/ SLA ${fmtWait(t.sla_seconds)}</span>
      </div>
      <div class="sub">${esc(t.context)}</div>
      <div class="sub">
        <span class="risk-why">为什么是${esc(t.risk_label || RISK_LABEL[lvl])}：${esc(t.risk_reason || "—")}</span>
        · 调度优先级 ${esc(t.priority || "—")}
      </div>
      <div class="sub">工单 ${esc(String(t.ticket_id).slice(0, 8))}… · 会话 ${esc(String(t.session_id).slice(0, 8))}…</div>
    </div>`;
}

// ── 详情 ──────────────────────────────────────────────
/** 打开一张工单。
 *  `opts.silent` 用于"顾客补充了新内容"触发的自动刷新：不要重新渲染队列
 *  （那会打断坐席正在看的行高亮/滚动位置），失败时也不要清空详情。
 */
async function openTicket(id, opts = {}) {
  state.current = id;
  // 换了一张工单，上一个工单的消息计数就不再可比了，清掉重新记
  if (!opts.silent) detailMsgCount = null;
  if (!opts.silent) renderQueue();
  try {
    const r = await fetch(`/ops/tickets/${id}`, { headers: headers() });
    if (!r.ok) throw new Error((await r.json()).message || r.status);
    state.detail = await r.json();
    renderDetail();
  } catch (e) {
    if (opts.silent) return;      // 自动刷新失败就保持原样，别把详情清成错误页
    $("detail").innerHTML = `<div class="empty">加载失败：${esc(e.message)}</div>`;
  }
}

function renderDetail() {
  const d = state.detail;
  if (!d) return;
  const t = d.ticket, rp = d.risk_report || {};
  $("detailTitle").textContent = `${t.priority} · ${t.reason} · ${t.status}`;

  const hits = (rp.hard_rule_hits || []).map((h) =>
    `<span class="hit">${esc(h.rule_id)} ${esc(h.title || "")}：${esc(h.span || "")}</span>`).join("");
  const panels = (rp.panel_reviews || []).map((p) =>
    `<div class="sub">· ${esc(p.role)}：level=${esc(p.level)} tags=${esc((p.risk_tags || []).join(",") || "—")}` +
    ` conf=${esc(p.confidence)}${p.abstain ? " (弃权)" : ""}${p.independent === false ? " (同族复核)" : ""}</div>`).join("");
  const evidence = (rp.evidence || []).map((e) =>
    `<div class="sub">[${esc(e.evidence_id)}] ${esc(e.doc_id)} ${esc(e.version)} score=${esc(e.score)}<br>${esc(e.text)}</div>`).join("");
  const msgs = (d.messages || []).map((m) =>
    `<div class="msg ${esc(m.role)}">${esc(m.content)}</div>`).join("");

  $("detail").innerHTML = `
    ${ACTIVE_STATUSES.includes(t.status) ? "" : `<div class="ended">
      <b>该工单已结束</b>（${esc(t.status)}），已从待处理队列移除，
      AI 已恢复自动回复 —— 顾客之后说的话由 AI 处理，不会再转到这里。
      ${t.closed_at ? `关闭时间 ${esc(String(t.closed_at).slice(0, 19).replace("T", " "))}。` : ""}
      ${t.close_reason ? `关闭原因：${esc(t.close_reason)}` : ""}
      <br>下面是这张单子的存档内容，仅供回看。
    </div>`}
    ${rp.transcript_deleted ? `<div class="tdel">
      <b>对话原文已被顾客删除。</b>按用户的删除请求，本工单里保存的对话快照与
      AI 草稿已抹除；审查结论（下面的规则命中与面板意见）按合规要求保留。
      所以下面的对话区是空的 —— 这是**预期行为**，不是系统故障。
    </div>` : ""}
    <div class="section">
      <h3>工单</h3>
      <dl class="kv">
        <dt>工单号</dt><dd>${esc(t.ticket_id)}</dd>
        <dt>会话</dt><dd>${esc(t.session_id)}</dd>
        <dt>转人工原因</dt><dd>${esc(t.reason)} · 优先级 ${esc(t.priority)}</dd>
        <dt>人工已接入</dt><dd>${t.human_joined
          ? '<span class="badge ok">是（可以告知用户）</span>'
          : '<span class="badge warn">否 —— 此时不得告知用户"人工已接入"</span>'}</dd>
      </dl>
    </div>
    <div class="section">
      <h3>画像摘要</h3>
      <div class="sub">${esc(t.profile_summary || "（无）")}</div>
    </div>
    <div class="section">
      <h3>风险报告</h3>
      <dl class="kv">
        <dt>审查结论</dt><dd>${esc(rp.verdict || "—")} / 风险等级 ${esc(rp.risk_level || "—")}</dd>
        <dt>同族复核</dt><dd>${rp.same_family_review
          ? '<span class="badge warn">是（MVP 单模型的已知缺口）</span>'
          : esc(String(rp.escalation_independent ?? "—"))}</dd>
      </dl>
      <div style="margin-top:8px">${hits || '<span class="sub">无硬规则命中</span>'}</div>
      <div style="margin-top:8px">${panels || '<span class="sub">无专家意见</span>'}</div>
      ${evidence ? `<h3 style="margin-top:12px">证据</h3>${evidence}` : ""}
      ${rp.draft ? `<h3 style="margin-top:12px">AI 未发出的草稿</h3><div class="msg system">${esc(rp.draft)}</div>` : ""}
    </div>
    <div class="section">
      <h3>对话记录${me && me.role === "service" ? "（敏感信息已脱敏）" : ""}</h3>
      ${msgs || '<div class="sub">（无）</div>'}
    </div>
    <div class="section">
      <h3>处置</h3>
      <div class="tools" style="margin-bottom:10px">
        <button class="primary" id="btnAccept" ${t.human_joined ? "disabled" : ""}>接单并接管</button>
        <button id="btnEscalate">转值班医师</button>
        <button id="btnMisreport">标记误报</button>
        <button class="danger" id="btnClose" ${t.status === "closed" ? "disabled" : ""}>关闭工单</button>
      </div>
      <textarea id="replyText" placeholder="给用户的回复（命中禁发词会被硬拦，命中提示类规则会先征求确认）"></textarea>
      <div class="tools" style="margin-top:8px">
        <button class="primary" id="btnReply">发送回复</button>
        <span class="sub">坐席不能代为执行预约/退费操作，只能引导用户走系统流程</span>
      </div>
    </div>`;

  $("btnAccept").onclick = () => act(`/ops/tickets/${t.ticket_id}/accept`, {}, "已接管，AI 已停用");
  $("btnEscalate").onclick = () => act(`/ops/tickets/${t.ticket_id}/escalate`, { reason: "转医师评估" }, "已升级给值班医师");
  $("btnClose").onclick = async () => {
    const reason = await dialogs.prompt({
      title: "关闭工单",
      body: "关单后 AI 恢复自动回复，顾客再说话由 AI 接手。\n关闭原因会计入审计记录。",
      input: {
        label: "关闭原因（必填）",
        value: "已电话沟通处理完成",
        placeholder: "例如：已电话沟通处理完成",
        required: true,
      },
      okText: "确认关闭",
      cancelText: "取消",
    });
    if (reason) act(`/ops/tickets/${t.ticket_id}/close`, { reason }, "工单已关闭，AI 已恢复");
  };
  $("btnMisreport").onclick = () => act(`/ops/tickets/${t.ticket_id}/misreport`,
    { source: "emergency", ref_id: "manual", raw_message: t.profile_summary || "",
      verdict: "false_positive", note: "坐席判定误报" }, "已标记误报，进入词表调优队列");
  $("btnReply").onclick = (e) => sendReply(e.target, t.ticket_id, false);
}

async function sendReply(btn, ticketId, ack) {
  const text = $("replyText").value.trim();
  if (!text) return toast("回复内容不能为空");
  btn.disabled = true;
  try {
    const r = await fetch(`/ops/tickets/${ticketId}/reply`, {
      method: "POST", headers: headers(),
      body: JSON.stringify({ text, acknowledge_warnings: ack }),
    });
    const data = await r.json();
    if (r.status === 409 && data.code === "soft_warning") {
      const list = (data.warnings || []).map((w) => w.rule_id + " " + (w.title || "")).join("；");
      btn.disabled = false;
      const go = await dialogs.confirm({
        title: "内容命中提示类规则",
        body: `${list}\n\n`
            + "这类规则只是软提示，不阻断发送 —— 但发送后由坐席为此负责。\n"
            + "确认仍要发送？",
        okText: "仍然发送",
        cancelText: "返回修改",
        danger: true,
      });
      if (go) return sendReply(btn, ticketId, true);
      return;
    }
    if (!r.ok) throw new Error(data.message || r.status);
    $("replyText").value = "";
    toast("回复已发送");
    openTicket(ticketId);
  } catch (e) {
    toast("发送失败：" + e.message, true);
  } finally {
    btn.disabled = false;
  }
}

async function act(url, body, okText) {
  try {
    const r = await fetch(url, { method: "POST", headers: headers(), body: JSON.stringify(body) });
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || r.status);
    toast(okText);
    await loadQueue();
    if (state.current) openTicket(state.current);
  } catch (e) {
    toast("操作失败：" + e.message, true);
  }
}

// ── 指标 ──────────────────────────────────────────────
function renderMetrics(m) {
  if (!m) return;
  const cells = [
    ["待处理工单", m.tickets_open ?? "—"],
    ["其中 P0", m.tickets_p0_open ?? "—"],
    ["已接单", m.tickets_accepted ?? "—"],
    ["一次通过率", m.first_pass_rate == null ? "—" : (m.first_pass_rate * 100).toFixed(1) + "%"],
    ["平均等待", m.avg_wait_seconds == null ? "—" : m.avg_wait_seconds + "s"],
    ["误报待复核", m.misreport_pending ?? "—"],
    ["同族复核次数", m.escalation_same_family ?? "—"],
  ];
  $("metrics").innerHTML = cells.map(([k, v]) =>
    `<div class="metric"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
}

// ── 实时流（fetch + reader，因为 EventSource 不能带自定义头）──
// `streamAbort` 用来在切换「显示测试工单」时**主动断开**上一条流：
// 查询串变了就必须重连，否则勾选框只影响一次性拉取、不影响推送。
let streamAbort = null;

async function connect() {
  if (streamAbort) { try { streamAbort.abort(); } catch (e) { /* 已断开 */ } }
  const ac = new AbortController();
  streamAbort = ac;
  const inc = $("showTest").checked ? "true" : "false";
  try {
    const r = await fetch("/ops/stream?include_test=" + inc,
                          { headers: headers(), signal: ac.signal });
    // 令牌真的失效了就别再无脑重连：每 3 秒撞一次 401，界面上只显示
    // "实时断开"，用户完全不知道要去重新登录。
    if (r.status === 401 || r.status === 403) {
      localStorage.removeItem("zhimei.agentToken");
      $("connDot").className = "dot";
      $("connText").textContent = "未登录";
      showAuth("登录已过期，请重新登录");
      return;
    }
    if (!r.ok || !r.body) throw new Error("stream unavailable");
    $("connDot").className = "dot on";
    $("connText").textContent = "实时已连接";
    const reader = r.body.getReader();
    const decoder = new TextDecoder();
    let buf = "";
    for (;;) {
      const { value, done } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      const parts = buf.split("\n\n");
      buf = parts.pop();
      for (const part of parts) handleEvent(part);
    }
    throw new Error("stream closed");
  } catch (e) {
    // 主动断开（切换勾选框触发的重连）不是故障，别报"断开"也别重连 ——
    // 新的那条流已经由 connect() 自己建好了。
    if (ac.signal.aborted) return;
    $("connDot").className = "dot";
    $("connText").textContent = "实时断开，3 秒后重连";
    setTimeout(connect, 3000);
  }
}

function handleEvent(chunk) {
  let name = "message", data = "";
  for (const line of chunk.split("\n")) {
    if (line.startsWith("event: ")) name = line.slice(7);
    else if (line.startsWith("data: ")) data += line.slice(6);
  }
  if (!data) return;
  const payload = JSON.parse(data);
  if (name === "snapshot") {
    state.tickets = payload.tickets || [];
    renderQueue();
    renderMetrics(payload.metrics);
    maybeRefreshDetail();
  } else if (name === "alert") {
    toast(`⚠ ${payload.message}`, true);
  }
}

/** 顾客在接管期间继续发言时，自动刷新正在看的详情。
 *
 *  ★ 为什么需要它：坐席点开一张工单后，看到的是**那一刻**的快照。
 *    而接管期间顾客仍然可以继续说话（AI 不答，消息转给坐席）——
 *    没有这个刷新，坐席会一直盯着一份过期对话，
 *    等顾客补充的"我疼得更厉害了"永远不出现。
 *
 *  ★ 但**只对未结束的工单**做这件事。工单关掉之后 AI 已经恢复自动回复，
 *    顾客再说话是找 AI 的，不该再推给坐席 —— 之前没有这个判断，
 *    表现就是"工单都结束了，还能收到顾客发来的请求"，
 *    而且队列里那张已关的工单 msg_count 一直在变，提示会反复弹。
 *    这不是"消息多一点"，而是**职责边界错了**：人工已经退场，
 *    系统却还在把顾客的话往人工这边送。
 *
 *  ★ 只刷新**打开的**那一张，且只在这里拉一次详情，不额外开轮询接口。
 */
async function maybeRefreshDetail() {
  if (!state.current) { detailMsgCount = null; return; }
  const row = state.tickets.find((t) => t.ticket_id === state.current);
  if (!row) return;
  const n = row.msg_count;
  if (n === undefined || n === null) return;
  if (detailMsgCount === null) { detailMsgCount = n; return; }   // 首次只记录
  if (n !== detailMsgCount) {
    detailMsgCount = n;
    // 工单已经不在待处理集合里（关掉了/被清理了）→ 停止跟踪，
    // 让坐席看到的最后一份内容留在屏幕上，不再打扰他
    if (!ACTIVE_STATUSES.includes(row.status)) {
      toast("该工单已结束，不再跟踪新消息（AI 已接手）", false);
      return;
    }
    await openTicket(state.current, {silent: true});
    toast("顾客补充了新内容，已刷新", false);
  }
}

$("refresh").onclick = () => { loadQueue(); if (state.current) openTicket(state.current); };

async function loadMetrics() {
  try {
    const r = await api("/ops/metrics", { headers: headers() });
    renderMetrics(await r.json());
  } catch (e) { /* 401 已经弹回登录页，这里不必再报 */ }
}

// ★ 先验令牌再干活。没登录就去拉队列只会拿到 401 再被弹回登录页，
//   用户会看到界面闪一下才跳走。
//
// ★ 关键约定：**只有 401 / 403 才算"没登录"**。其它一切异常（网络不通、
//   500、响应不是 JSON、启动过程里某个函数拼错）都保留令牌并如实报出来。
//   这条约定是踩出来的：原来这里用一个大 try/catch 包住"校验 + 全部初始化"，
//   结果 `bootData()` 里一个拼错的函数名让每次刷新都跳登录页，
//   而排查方向被"登录"两个字带偏了很久。
(async function start() {
  const t = localStorage.getItem("zhimei.agentToken");
  if (!t) { showAuth(); return; }

  let r;
  try {
    r = await fetch("/ops/auth/me", {headers: {Authorization: "Bearer " + t}});
  } catch (e) {
    keepTokenBoot("连不上服务（" + e.message + "）");
    return;
  }
  if (r.status === 401 || r.status === 403) {
    localStorage.removeItem("zhimei.agentToken");
    showAuth("登录已过期，请重新登录");
    return;
  }
  if (!r.ok) { keepTokenBoot("服务返回 HTTP " + r.status); return; }

  let d;
  try {
    d = await r.json();
  } catch (e) {
    keepTokenBoot("响应不是合法 JSON（" + e.message + "）");
    return;
  }
  me = d.agent;
  myPerms = d.permissions || [];
  applyIdentity();
  hideAuth();
  await bootData();
})();
</script>
